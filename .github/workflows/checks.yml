name: Validar projeto
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows_configurator:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Verificar janela, colagem e envio privado no Windows PowerShell
        shell: powershell
        run: powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File tests/windows-configurator.ps1
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: leadcaps_test
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: leadcaps_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U leadcaps_test -d leadcaps_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://leadcaps_test:ci-only-password@127.0.0.1:5432/leadcaps_test
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: npm run validate
      - run: npx playwright install --with-deps chromium --only-shell
      - run: npm run test:ui
      - run: docker compose --env-file deploy/ci.env config --quiet
      - run: docker compose --env-file deploy/ci.env up -d --build --wait --wait-timeout 90
      - run: curl --fail http://127.0.0.1:8310/health
      - uses: actions/upload-artifact@v7
        with:
          name: leadcaps-netlify-demo
          path: dist/index.html
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: evidencias-interface-ficticia
          path: test-results/*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Encerrar containers exclusivos do teste
        if: always()
        run: docker compose --env-file deploy/ci.env down
  https_gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -p '*_test.py' -v
      - name: Preparar proxy e instalação fictícios
        run: |
          cp deploy/ci.env .env
          docker network create synapse-network
          mkdir -p test-results/https
          printf '{\n auto_https off\n}\nhttp://keep.example.test:8082 {\n respond "existing-route-ok"\n}\n' > test-results/https/Caddyfile
          docker run -d --name leadcaps-caddy-ci --network synapse-network -v "$PWD/test-results/https/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine
          docker compose up -d --build --wait --wait-timeout 120
      - name: Ativar e verificar gateway e origem permitida
        run: |
          sudo python3 deploy/enable_https.py --apply --caddy-container leadcaps-caddy-ci --caddy-file "$PWD/test-results/https/Caddyfile"
          docker exec leadcaps-caddy-ci wget -q -O- http://127.0.0.1:8082 -Y off --header='Host: keep.example.test'
          curl --fail -i -X OPTIONS -H 'Origin: https://leadcaps.synapseia.com.br' -H 'Access-Control-Request-Method: POST' http://127.0.0.1:8310/v1/sessions
      - name: Verificar repetição e resolução após recriar API
        run: |
          sudo python3 deploy/enable_https.py --apply --caddy-container leadcaps-caddy-ci --caddy-file "$PWD/test-results/https/Caddyfile"
          docker compose up -d --no-deps --force-recreate --wait --wait-timeout 120 api
          docker exec leadcaps-caddy-ci wget -q -O- http://leadcaps-gateway:8080/health
      - name: Verificar restauração quando validação do Caddy falha
        run: |
          cp .env test-results/https/env.before-test
          cp compose.override.yaml test-results/https/override.before-test
          cp test-results/https/Caddyfile test-results/https/Caddyfile.before-test
          python3 - <<'PY'
          from pathlib import Path
          p = Path('deploy/enable_https.py')
          text = p.read_text().replace('reverse_proxy leadcaps-gateway:8080', 'invalid_directive_for_rollback_test')
          p.write_text(text)
          PY
          if sudo python3 deploy/enable_https.py --apply --caddy-container leadcaps-caddy-ci --caddy-file "$PWD/test-results/https/Caddyfile"; then
            echo 'Era esperada uma falha na validação.'
            exit 1
          fi
          cmp .env test-results/https/env.before-test
          cmp compose.override.yaml test-results/https/override.before-test
          cmp test-results/https/Caddyfile test-results/https/Caddyfile.before-test
          docker exec leadcaps-caddy-ci wget -q -O- http://leadcaps-gateway:8080/health
      - name: Encerrar somente recursos do teste
        if: always()
        run: |
          docker compose down
          docker rm -f leadcaps-caddy-ci
          docker network rm synapse-network
